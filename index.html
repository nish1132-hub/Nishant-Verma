<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nishant's Music Lounge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 46, 0.7);
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at top right, #1e1b4b, #090d16 60%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 80px;
    }
    .header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff, #c4b5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .player-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cover-art {
      width: 200px;
      height: 200px;
      border-radius: 20px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px var(--accent-glow);
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .cover-art svg {
      width: 80px;
      height: 80px;
      fill: #ffffff;
      opacity: 0.9;
    }
    .song-details {
      text-align: center;
      width: 100%;
      margin-bottom: 16px;
    }
    .song-title {
      font-size: 1.25rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .song-artist {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }
    .progress-container {
      width: 100%;
      margin-bottom: 16px;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #c084fc;
      cursor: pointer;
      box-shadow: 0 0 10px #c084fc;
    }
    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 6px;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: 100%;
      margin-bottom: 20px;
    }
    .btn-circle {
      border: none;
      background: none;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease;
    }
    .btn-circle:active {
      transform: scale(0.9);
    }
    .btn-play {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      box-shadow: 0 8px 20px var(--accent-glow);
    }
    .btn-play svg {
      width: 26px;
      height: 26px;
      fill: #fff;
    }
    .playlist-section {
      width: 100%;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .playlist-header {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }
    .track-list {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .track-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .track-item.active {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .track-name {
      font-size: 0.88rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>My Recorded Songs</h1>
    <p>Tap any track to stream instantly</p>
  </div>

  <div class="player-card">
    <div class="cover-art">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>

    <div class="song-details">
      <div class="song-title" id="songTitle">Select a track</div>
      <div class="song-artist" id="songArtist">Recorded Collection</div>
    </div>

    <div class="progress-container">
      <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100">
      <div class="time-info">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="btn-circle" id="prevBtn">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="btn-circle btn-play" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="btn-circle" id="nextBtn">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="playlist-section">
      <div class="playlist-header">All Recordings</div>
      <ul class="track-list" id="trackList"></ul>
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    // Apne audio links yahan badal sakte ho:
    const songs = [
      {
        title: "Sample Song 1",
        artist: "Nishant",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      },
      {
        title: "Sample Song 2",
        artist: "Nishant",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
      }
    ];

    let currentIdx = 0;
    const audio = document.getElementById("audio");
    const playBtn = document.getElementById("playBtn");
    const playIcon = document.getElementById("playIcon");
    const songTitle = document.getElementById("songTitle");
    const songArtist = document.getElementById("songArtist");
    const progressBar = document.getElementById("progressBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const trackList = document.getElementById("trackList");

    function loadSong(index) {
      currentIdx = index;
      const s = songs[index];
      songTitle.textContent = s.title;
      songArtist.textContent = s.artist;
      audio.src = s.src;
      updatePlaylistUI();
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
      } else {
        audio.pause();
        playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
      }
    }

    function updatePlaylistUI() {
      trackList.innerHTML = "";
      songs.forEach((s, idx) => {
        const li = document.createElement("li");
        li.className = `track-item ${idx === currentIdx ? 'active' : ''}`;
        li.innerHTML = `<span class="track-name">${s.title}</span>`;
        li.onclick = () => { loadSong(idx); audio.play(); playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'; };
        trackList.appendChild(li);
      });
    }

    playBtn.addEventListener("click", togglePlay);
    document.getElementById("prevBtn").addEventListener("click", () => {
      currentIdx = (currentIdx - 1 + songs.length) % songs.length;
      loadSong(currentIdx);
      audio.play();
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      currentIdx = (currentIdx + 1) % songs.length;
      loadSong(currentIdx);
      audio.play();
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    });

    audio.addEventListener("timeupdate", () => {
      if (audio.duration) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        currentTimeEl.textContent = formatTime(audio.currentTime);
        durationEl.textContent = formatTime(audio.duration);
      }
    });

    progressBar.addEventListener("input", () => {
      if (audio.duration) {
        audio.currentTime = (progressBar.value / 100) * audio.duration;
      }
    });

    audio.addEventListener("ended", () => {
      document.getElementById("nextBtn").click();
    });

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    loadSong(0);
